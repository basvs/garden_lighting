<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2b5a"/>
      <stop offset=".55" stop-color="#3b5c8c"/>
      <stop offset="1" stop-color="#e9a86a"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8f4a"/><stop offset="1" stop-color="#2c6e38"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc04a"/><stop offset="1" stop-color="#3d9a3a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#ffb84d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bulb" cx=".45" cy=".6" r=".6">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset=".6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a13a"/>
    </radialGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="48"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <circle cx="44" cy="48" r="2" fill="#fff" opacity=".8"/>
    <circle cx="74" cy="26" r="1.5" fill="#fff" opacity=".7"/>
    <circle cx="30" cy="92" r="1.3" fill="#fff" opacity=".6"/>
    <path d="M0 170 C50 140 110 150 160 165 C200 177 230 160 256 150 V256 H0 Z" fill="url(#hillBack)"/>
    <!-- tree -->
    <rect x="58" y="128" width="10" height="62" rx="3" fill="#5a3d26"/>
    <circle cx="63" cy="118" r="26" fill="#2f7d3c"/>
    <circle cx="48" cy="130" r="18" fill="#2f7d3c"/>
    <circle cx="78" cy="128" r="18" fill="#357f40"/>
    <circle cx="56" cy="110" r="12" fill="#3f9349" opacity=".9"/>
    <rect x="109" y="34" width="6" height="160" rx="2" fill="#4a3424"/>
    <!-- lawn -->
    <path d="M0 196 C60 172 130 178 190 192 C220 199 240 196 256 190 V256 H0 Z" fill="url(#hillFront)"/>
    <!-- shrubs -->
    <ellipse cx="196" cy="196" rx="30" ry="18" fill="#2f8a3a"/>
    <ellipse cx="216" cy="190" rx="20" ry="14" fill="#3a9a42"/>
    <ellipse cx="120" cy="214" rx="22" ry="11" fill="#4fae44"/>
    <!-- flowers -->
    <g fill="#ffd1e0"><circle cx="30" cy="222" r="3.5"/><circle cx="44" cy="230" r="3"/><circle cx="160" cy="226" r="3.2"/></g>
    <g fill="#fff1a8"><circle cx="72" cy="232" r="3"/><circle cx="178" cy="236" r="3.4"/><circle cx="96" cy="240" r="2.6"/></g>
    <!-- string of lights -->
    <path d="M112 40 Q186 70 262 36" fill="none" stroke="#23272c" stroke-width="2.4" stroke-linecap="round"/>
    
    <g transform="translate(129.8 46.3)">
      <circle cx="0" cy="17" r="20" fill="url(#glow)"/>
      <rect x="-3.2" y="0" width="6.4" height="6" rx="1.2" fill="#3a3f45"/>
      <path d="M0 5 C-7 7 -8 15 -6.2 20 C-4.6 24.5 4.6 24.5 6.2 20 C8 15 7 7 0 5 Z" fill="url(#bulb)"/>
      <ellipse cx="-2.2" cy="13" rx="1.6" ry="3.2" fill="#fffbe6" opacity=".85"/>
    </g>
    <g transform="translate(162.6 53.0)">
      <circle cx="0" cy="17" r="20" fill="url(#glow)"/>
      <rect x="-3.2" y="0" width="6.4" height="6" rx="1.2" fill="#3a3f45"/>
      <path d="M0 5 C-7 7 -8 15 -6.2 20 C-4.6 24.5 4.6 24.5 6.2 20 C8 15 7 7 0 5 Z" fill="url(#bulb)"/>
      <ellipse cx="-2.2" cy="13" rx="1.6" ry="3.2" fill="#fffbe6" opacity=".85"/>
    </g>
    <g transform="translate(195.5 53.5)">
      <circle cx="0" cy="17" r="20" fill="url(#glow)"/>
      <rect x="-3.2" y="0" width="6.4" height="6" rx="1.2" fill="#3a3f45"/>
      <path d="M0 5 C-7 7 -8 15 -6.2 20 C-4.6 24.5 4.6 24.5 6.2 20 C8 15 7 7 0 5 Z" fill="url(#bulb)"/>
      <ellipse cx="-2.2" cy="13" rx="1.6" ry="3.2" fill="#fffbe6" opacity=".85"/>
    </g>
    <g transform="translate(228.7 47.9)">
      <circle cx="0" cy="17" r="20" fill="url(#glow)"/>
      <rect x="-3.2" y="0" width="6.4" height="6" rx="1.2" fill="#3a3f45"/>
      <path d="M0 5 C-7 7 -8 15 -6.2 20 C-4.6 24.5 4.6 24.5 6.2 20 C8 15 7 7 0 5 Z" fill="url(#bulb)"/>
      <ellipse cx="-2.2" cy="13" rx="1.6" ry="3.2" fill="#fffbe6" opacity=".85"/>
    </g>
  </g>
</svg>
